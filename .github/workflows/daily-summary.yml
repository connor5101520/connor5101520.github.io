name: Daily Summary Email

on:
  schedule:
    # 5:00 PM PST = 1:00 AM UTC (next day)
    # PST is UTC-8, so 17:00 PST = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch: # Allow manual triggers for testing

jobs:
  send-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          GRANOLA_API_TOKEN: ${{ secrets.GRANOLA_API_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_SENDER_EMAIL: ${{ secrets.SENDGRID_SENDER_EMAIL }}
        run: python -m daily_summary.main
